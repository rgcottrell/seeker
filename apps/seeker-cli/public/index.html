<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>seeker</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        display: flex; flex-direction: column;
        max-width: 820px; margin: 0 auto; padding: 0 16px;
      }
      header {
        display: flex; align-items: baseline; gap: 10px;
        padding: 16px 4px 10px; border-bottom: 1px solid color-mix(in srgb, currentColor 15%, transparent);
      }
      header h1 { font-size: 18px; margin: 0; }
      header .model { font-size: 12px; opacity: 0.6; }
      #log { flex: 1; overflow-y: auto; padding: 16px 0; }
      .msg { display: flex; margin: 8px 0; }
      .msg.user { justify-content: flex-end; }
      .bubble {
        max-width: 80%; padding: 8px 12px; border-radius: 14px;
        white-space: pre-wrap; word-wrap: break-word;
      }
      .user .bubble { background: #2563eb; color: #fff; border-bottom-right-radius: 4px; }
      .assistant .bubble {
        background: color-mix(in srgb, currentColor 8%, transparent);
        border-bottom-left-radius: 4px;
      }
      .bubble .cursor { opacity: 0.5; }
      form {
        display: flex; gap: 8px; padding: 12px 0 20px;
        border-top: 1px solid color-mix(in srgb, currentColor 15%, transparent);
      }
      #msg {
        flex: 1; resize: none; padding: 10px 12px; border-radius: 10px;
        border: 1px solid color-mix(in srgb, currentColor 25%, transparent);
        background: transparent; color: inherit; font: inherit;
      }
      button {
        padding: 0 18px; border: 0; border-radius: 10px;
        background: #2563eb; color: #fff; font: inherit; cursor: pointer;
      }
      button:disabled { opacity: 0.5; cursor: default; }
    </style>
  </head>
  <body>
    <header>
      <h1>seeker</h1>
      <span class="model" id="model-label">connecting…</span>
    </header>
    <div id="log"></div>
    <form id="form">
      <textarea id="msg" rows="1" placeholder="Send a message…" autofocus></textarea>
      <button id="send" type="submit">Send</button>
    </form>

    <script>
      const logEl = document.getElementById("log");
      const formEl = document.getElementById("form");
      const inputEl = document.getElementById("msg");
      const sendEl = document.getElementById("send");
      const modelLabel = document.getElementById("model-label");

      // Conversation history sent on every request.
      const messages = [];
      let model = "seeker";

      // Pick the loaded model id so the request matches what the server serves.
      fetch("/v1/models")
        .then((r) => (r.ok ? r.json() : null))
        .then((j) => {
          const id = j && j.data && j.data[0] && j.data[0].id;
          if (id) model = id;
          modelLabel.textContent = model;
        })
        .catch(() => {
          modelLabel.textContent = model;
        });

      function addBubble(role, text) {
        const wrap = document.createElement("div");
        wrap.className = "msg " + role;
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = text;
        wrap.appendChild(bubble);
        logEl.appendChild(wrap);
        logEl.scrollTop = logEl.scrollHeight;
        return bubble;
      }

      // Auto-grow the textarea; Enter sends, Shift+Enter inserts a newline.
      inputEl.addEventListener("input", () => {
        inputEl.style.height = "auto";
        inputEl.style.height = inputEl.scrollHeight + "px";
      });
      inputEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          formEl.requestSubmit();
        }
      });

      formEl.addEventListener("submit", async (e) => {
        e.preventDefault();
        const content = inputEl.value.trim();
        if (!content) return;

        addBubble("user", content);
        messages.push({ role: "user", content });
        inputEl.value = "";
        inputEl.style.height = "auto";
        sendEl.disabled = true;

        const bubble = addBubble("assistant", "");
        const cursor = document.createElement("span");
        cursor.className = "cursor";
        cursor.textContent = "▍";
        bubble.appendChild(cursor);

        let reply = "";
        const render = () => {
          bubble.textContent = reply;
          bubble.appendChild(cursor);
          logEl.scrollTop = logEl.scrollHeight;
        };

        try {
          const resp = await fetch("/v1/chat/completions", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ model, messages, stream: true }),
          });
          if (!resp.ok || !resp.body) {
            throw new Error("HTTP " + resp.status);
          }

          // Parse the Server-Sent Events stream: `data: {json}` lines,
          // terminated by `data: [DONE]`.
          const reader = resp.body.getReader();
          const decoder = new TextDecoder();
          let buf = "";
          for (;;) {
            const { value, done } = await reader.read();
            if (done) break;
            buf += decoder.decode(value, { stream: true });
            let nl;
            while ((nl = buf.indexOf("\n")) >= 0) {
              const line = buf.slice(0, nl).trim();
              buf = buf.slice(nl + 1);
              if (!line.startsWith("data:")) continue;
              const data = line.slice(5).trim();
              if (data === "[DONE]") continue;
              try {
                const chunk = JSON.parse(data);
                const delta =
                  chunk.choices &&
                  chunk.choices[0] &&
                  chunk.choices[0].delta &&
                  chunk.choices[0].delta.content;
                if (delta) {
                  reply += delta;
                  render();
                }
              } catch (_) {
                /* ignore keep-alive / partial lines */
              }
            }
          }
          messages.push({ role: "assistant", content: reply });
        } catch (err) {
          reply = reply || "⚠️ " + (err && err.message ? err.message : "request failed");
          messages.pop(); // drop the user turn so a retry isn't doubled
        } finally {
          cursor.remove();
          bubble.textContent = reply;
          sendEl.disabled = false;
          inputEl.focus();
        }
      });
    </script>
  </body>
</html>
