[package]
name = "seeker-cli"
version.workspace = true
edition.workspace = true

# The application: clap entry point, all subcommands, and the HTTP server. Drives
# the seeker-vulkan backend library. The binary keeps the name `seeker` so
# `target/release/seeker`, `--bin seeker`, the Containerfile and the justfile are
# unchanged.
[[bin]]
name = "seeker"
path = "src/main.rs"

[dependencies]
seeker-core = { path = "../../crates/seeker-core" }
seeker-vulkan = { path = "../../crates/seeker-vulkan" }
# Optional NPU backend, enabled by the `npu` feature. Off by default so a plain
# build never compiles the XRT shim. (The crate itself degrades to an XRT-free
# stub when XILINX_XRT is absent, so even `--features npu` builds without an NPU.)
seeker-npu = { path = "../../crates/seeker-npu", optional = true }
ash = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
dirs = { workspace = true }
futures-util = { workspace = true }
glob = { workspace = true }
hf-hub = { workspace = true }
base64 = { workspace = true }
rustyline = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokenizers = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
# Forward up the chain cli -> vulkan -> core. Both targets are listed explicitly
# so cli's own `#[cfg(feature)]` sites (e.g. commands/run.rs smoke tests) and the
# core accessors flip together; missing a hop silently compiles the OFF path.
profile_gpu = ["seeker-vulkan/profile_gpu", "seeker-core/profile_gpu"]
gpu_debug = ["seeker-vulkan/gpu_debug", "seeker-core/gpu_debug"]
# Compile + wire the Strix Halo NPU backend (`--device npu`). Needs XRT to do real
# NPU work; builds (as a stub) without it.
npu = ["dep:seeker-npu"]
