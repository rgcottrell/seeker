[workspace]
resolver = "3"
members = ["crates/seeker-core", "crates/seeker-vulkan", "apps/seeker-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"

# Dependencies shared across the workspace. Each member opts in with
# `dep.workspace = true`, so versions/features are declared once here.
[workspace.dependencies]
ash = { git = "https://github.com/ash-rs/ash", branch = "master", features = ["provisional"] }
axum = { version = "0.8", features = ["macros"] }
clap = { version = "4", features = ["derive"] }
dirs = "5"
futures-util = "0.3"
glob = "0.3"
hf-hub = "0.5.0"
# Image decode for vision (mmproj) preprocessing. Default features pull every
# codec; we only need the common still formats, so trim to keep the dep tree
# small. Used purely for *decoding* to interleaved RGB8 — the smart-resize is
# hand-rolled in `seeker-core` `vision/preprocess.rs` to byte-match llama.cpp's
# corner-aligned bilinear (the `image` crate's resampling filters use a
# different convention).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }
# Decode base64 image data URLs in `seeker serve` chat requests (OpenAI
# `image_url` content parts arrive as `data:image/...;base64,<...>`).
base64 = "0.22"
indexmap = "2.14.0"
jiff = "0.2"
memmap2 = "0.9.10"
minijinja = "2"
rand = "0.8"
rustyline = { version = "15", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Audio decode for the gemma4 `gemma4ua` audio encoder (mmproj). Like `image`,
# default features pull every codec; trim to the common still/streaming formats.
# Used purely for *decoding* to interleaved f32 PCM — the encoder wants 16 kHz
# mono, so `seeker-core` `audio/decode.rs` downmixes and (if the source rate
# differs) resamples to 16 kHz with `rubato`. A 16 kHz mono clip skips the
# resampler and matches `llama-mtmd-cli` byte-for-byte.
symphonia = { version = "0.6.0", default-features = false, features = ["wav", "pcm", "adpcm", "mp3", "flac", "isomp4", "aac", "alac", "ogg", "vorbis"] }
rubato = "3.0.0"

# Faster debug/test builds (release is left fully optimized). `line-tables-only`
# keeps file:line in panics/backtraces but drops variable-level debuginfo, which
# is the bulk of debuginfo generation + linking cost; `unpacked` keeps debuginfo
# out of the linked artifact for a further link speedup. The test profile
# inherits these from dev. Profiles are only honored at the workspace root.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
